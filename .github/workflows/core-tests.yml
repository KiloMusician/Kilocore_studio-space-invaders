name: core-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q main.py space_invaders tests
      - name: Run renderer-free contract tests
        run: python -m unittest discover -s tests -v
      - name: Run deterministic headless canary
        run: python -m space_invaders.simulate --episodes 2 --seed 3044 --max-ticks 600
